services:
  postgres:
    image: postgres:17
    container_name: college_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-college_portal}
      POSTGRES_USER: ${POSTGRES_USER:-college_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-college_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-college_user} -d ${POSTGRES_DB:-college_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_dev_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_VERSION: ${APP_VERSION:-0.8.0-rc2}
      APP_RELEASE: ${APP_RELEASE:-v0.8.0-rc2}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-college_portal}
      DB_USERNAME: ${POSTGRES_USER:-college_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-college_password}

  frontend:
    image: node:22-alpine
    container_name: college_dev_frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_APP_ENV: ${VITE_APP_ENV:-development}
      VITE_HTTPS_PORT: ${HTTPS_PORT:-5443}
      VITE_BUILD_GIT_DIR: /repo/.git
    volumes:
      - ./frontend:/app
      - ./.git:/repo/.git:ro
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5174}:5173"
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev -- --host 0.0.0.0; else tail -f /dev/null; fi"

  nginx:
    image: nginx:1.27-alpine
    container_name: college_dev_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-8001}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro

  https-proxy:
    image: nginx:1.27-alpine
    container_name: college_dev_https_proxy
    restart: unless-stopped
    depends_on:
      - nginx
      - frontend
    ports:
      - "${HTTPS_PORT:-5443}:443"
    volumes:
      - ./infra/dev-https/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/dev-https/certs:/etc/nginx/certs:ro

volumes:
  postgres_dev_data:
