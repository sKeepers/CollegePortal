services:
  postgres:
    image: postgres:17
    container_name: college_portal_postgres
    environment:
      POSTGRES_DB: college_portal
      POSTGRES_USER: college_user
      POSTGRES_PASSWORD: college_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_portal_backend
    depends_on:
      - postgres
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: college_portal
      DB_USERNAME: college_user
      DB_PASSWORD: college_password

  frontend:
    image: node:lts
    container_name: college_portal_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  nginx:
    image: nginx:alpine
    container_name: college_portal_nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html

volumes:
  postgres_data:
