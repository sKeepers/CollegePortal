name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main, feature/gia-001-fis-gateway-exchange]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, intl, zip, gd, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  gateway:
    name: Gateway build
    runs-on: windows-2022
    defaults:
      run:
        working-directory: integrations/collegeportal-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build .NET Framework 4.8 Gateway
        shell: cmd
        run: build.cmd

      - name: Verify executable
        shell: pwsh
        run: if (-not (Test-Path 'artifacts/Release/CollegePortal.Gateway.Host.exe')) { throw 'Gateway executable was not produced.' }

      - name: Run Gateway console smoke tests
        shell: pwsh
        run: |
          ./artifacts/Tests/CollegePortal.Gateway.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Gateway security tests failed.' }
          ./tests/smoke-console.ps1

      - name: Build and verify installation package
        shell: pwsh
        run: |
          ./package.ps1
          ./tests/verify-package.ps1 -PackagePath "../../releases/collegeportal-gateway-$((Get-Content VERSION -Raw).Trim()).zip"

      - name: Upload verified Gateway package
        uses: actions/upload-artifact@v4
        with:
          name: collegeportal-gateway-${{ github.sha }}
          path: |
            releases/collegeportal-gateway-*.zip
            releases/collegeportal-gateway-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Verify FIS safety stop-gates
        shell: pwsh
        run: |
          $adapter = Get-Content 'src/CollegePortal.Gateway.Adapters.Fis/FisIntegrationAdapter.cs' -Raw
          $client = Get-Content 'src/CollegePortal.Gateway.Adapters.Fis/FisSoapClient.cs' -Raw
          if ($adapter -notmatch 'official_wsdl_missing') {
            throw 'FIS read-only operations must remain disabled without the official WSDL.'
          }
          if ($adapter -notmatch 'production_disabled') {
            throw 'FIS production stop-gate is missing.'
          }
          if ($client -match 'tempuri\.org' -or $client -match 'HttpWebRequest' -or $client -match 'GetResponse\(') {
            throw 'Gateway contains a guessed SOAP contract or an HTTP request before contract approval.'
          }
          if ($client -notmatch 'AllowedTestHost = "10\.0\.3\.1"' -or $client -notmatch 'AllowedTestPort = 8383') {
            throw 'Gateway FIS TEST endpoint allowlist is missing.'
          }

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --no-banner --exit-code 1
