# Шаблон nginx для релизной установки CollegePortal.
#
# Штатный entrypoint образа nginx подставляет сюда ${DOMAIN_OR_IP}, ${HTTPS_MODE}
# и ${HTTPS_PORT} через envsubst и кладёт результат в conf.d/default.conf.
# Подставляются только переменные окружения контейнера; переменные самого nginx
# записываются как $name и остаются нетронутыми.

# Режим установки в виде переменной nginx. "http" — установка без TLS; любое
# другое значение (existing-cert, letsencrypt, self-signed, https) означает, что
# сертификат настроен и трафик обязан идти по HTTPS.
map $host $cp_https_mode {
    default "${HTTPS_MODE}";
}

map $cp_https_mode $cp_https_enabled {
    default 1;
    "http"  0;
}

# Публичный порт HTTPS. Нужен, чтобы редирект не терял нестандартный порт.
map $host $cp_https_port {
    default "${HTTPS_PORT}";
}

map $cp_https_port $cp_https_port_suffix {
    default ":${HTTPS_PORT}";
    "443"   "";
    ""      "";
}

# Проверка Let's Encrypt по HTTP-01 не должна перенаправляться: иначе продление
# способом --webroot перестанет работать.
map $request_uri $cp_acme_challenge {
    default                           0;
    "~^/\.well-known/acme-challenge/" 1;
}

# Ключ склеен из $scheme, $cp_https_enabled и $cp_acme_challenge. Единственный
# случай перенаправления: пришли по HTTP, TLS настроен, и это не проверка ACME.
map "$scheme$cp_https_enabled$cp_acme_challenge" $cp_force_https {
    default  0;
    "http10" 1;
}

# HSTS выдаётся только по HTTPS и только при настроенном TLS. Пустое значение
# add_header не добавляет, поэтому в режиме http заголовка не будет.
map "$scheme$cp_https_enabled" $cp_hsts {
    default  "";
    "https1" "max-age=31536000; includeSubDomains";
}

map $cp_https_enabled $cp_csp_upgrade {
    default "";
    "1"     " upgrade-insecure-requests;";
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN_OR_IP};
    client_max_body_size 20m;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security $cp_hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "accelerometer=(), camera=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self';$cp_csp_upgrade" always;

    # Проверка выполняется в фазе rewrite, до выбора location, поэтому исключение
    # для ACME задано в $cp_force_https, а не отдельным location.
    if ($cp_force_https) {
        return 301 https://$host$cp_https_port_suffix$request_uri;
    }

    # Каталог пуст при продлении способом --standalone. Смонтирован ради перехода
    # на --webroot, то есть продления без остановки портала.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location ~ ^/health(/live|/ready)?$ {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ \.php$ {
        return 404;
    }
}
