services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-college_portal}
      POSTGRES_USER: ${POSTGRES_USER:-college_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-college_user} -d ${POSTGRES_DB:-college_portal}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.release
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
    volumes:
      - backend_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [internal]

  scheduler:
    build:
      context: ../backend
      dockerfile: Dockerfile.release
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file: ../.env
    command: ["sh", "-lc", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    volumes:
      - backend_storage:/var/www/html/storage
    networks: [internal]

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.release
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file: ../.env
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    volumes:
      - backend_storage:/var/www/html/storage
    networks: [internal]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.release
    restart: unless-stopped
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./templates/nginx-release.conf:/etc/nginx/templates/default.conf.template:ro
      - ../certs:/etc/nginx/certs:ro
      - backend_storage:/var/www/html/storage:ro
    environment:
      DOMAIN_OR_IP: ${DOMAIN_OR_IP:-localhost}
      HTTPS_MODE: ${HTTPS_MODE:-http}
    networks: [internal, public]

volumes:
  postgres_data:
  redis_data:
  backend_storage:

networks:
  internal:
    internal: true
  public:
